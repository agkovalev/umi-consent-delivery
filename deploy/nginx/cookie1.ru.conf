server {
    listen 80;
    server_name cookie1.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 301 https://cookie1.ru$request_uri; }
}

server {
    listen 443 ssl;
    server_name cookie1.ru;

    ssl_certificate /etc/letsencrypt/live/cookie1.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cookie1.ru/privkey.pem;
    access_log /var/log/nginx/umi-consent-delivery.access.log umi_consent_delivery;
    limit_req zone=umi_consent_delivery_ip burst=20 nodelay;
    limit_req_status 429;

    location = /health {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / { return 404; }
}

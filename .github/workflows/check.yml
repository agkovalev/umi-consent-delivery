name: Check
on: [push, pull_request]
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level high
      - run: docker build -f docker/php.Dockerfile -t delivery-php-test .
      - run: docker run --rm -v "$PWD/client:/app/client:ro" -v "$PWD/tests:/app/tests:ro" delivery-php-test php /app/tests/client-test.php
